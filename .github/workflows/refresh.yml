# Le robot du dashboard : régénère data + HTML chaque dimanche, commit si ça a changé.
name: refresh dashboard

on:
  schedule:
    # Tous les dimanches à 03:00 UTC (04 ou 05 h Paris selon l'heure d'été).
    - cron: "0 3 * * 0"
  workflow_dispatch:  # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write  # autorisation pour commit/push vers le repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Régénérer les données
        run: python generate_data.py

      - name: Reconstruire le dashboard
        run: python build_dashboard.py

      - name: Commit si quelque chose a changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/depenses.csv dashboard/index.html
          if git diff --cached --quiet; then
            echo "Rien de neuf ce coup-ci."
          else
            git commit -m "chore: refresh dashboard ($(date -u +'%Y-%m-%d'))"
            git push
          fi
